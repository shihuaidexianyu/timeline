name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p timeline -p common --all-targets -- -D warnings
      - run: cargo test -p timeline
      - run: cargo test -p common
      - run: npm ci
        working-directory: apps/web-ui
      - run: npm run check
        working-directory: apps/web-ui
      - name: Verify Rust and TypeScript protocol mirrors
        run: .\scripts\check-protocol-sync.ps1
        shell: pwsh
      - run: npx playwright install chromium
        working-directory: apps/web-ui
      - run: npm run test:e2e
        working-directory: apps/web-ui
      - run: npm test
        working-directory: apps/browser-extension
      - name: Verify version consistency
        shell: pwsh
        run: |
          $root = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($root, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          $extension = (Get-Content apps/browser-extension/manifest.json -Raw | ConvertFrom-Json).version
          $web = (Get-Content apps/web-ui/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $extension -or $version -ne $web) { throw "Version mismatch: $version / $extension / $web" }

  installer-smoke:
    if: github.event_name == 'push'
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/web-ui
      - run: choco install innosetup --no-progress -y
      - run: .\scripts\build-installer.ps1
        shell: pwsh
      - name: Silent install and uninstall smoke test
        shell: pwsh
        run: |
          $setup = Resolve-Path target/installer/output/timeline-setup.exe
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Install failed: $LASTEXITCODE" }
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\Timeline'
          if (-not (Test-Path (Join-Path $installRoot 'timeline.exe'))) { throw 'Installed executable missing' }
          Set-Content -LiteralPath (Join-Path $installRoot 'config\upgrade-preserved.marker') -Value 'config'
          Set-Content -LiteralPath (Join-Path $installRoot 'data\upgrade-preserved.marker') -Value 'data'
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Upgrade failed: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $installRoot 'config\upgrade-preserved.marker'))) { throw 'Upgrade removed config data' }
          if (-not (Test-Path (Join-Path $installRoot 'data\upgrade-preserved.marker'))) { throw 'Upgrade removed activity data' }
          & (Join-Path $installRoot 'unins000.exe') /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed: $LASTEXITCODE" }

  release-verification:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: test
    env:
      TIMELINE_SIGNTOOL_COMMAND: ${{ secrets.TIMELINE_SIGNTOOL_COMMAND }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/web-ui
      - run: choco install innosetup --no-progress -y
      - name: Require release signing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TIMELINE_SIGNTOOL_COMMAND)) {
            throw 'TIMELINE_SIGNTOOL_COMMAND secret is required for release tags'
          }
      - run: .\scripts\build-installer.ps1
        shell: pwsh
      - name: Verify signed installer and embedded version
        shell: pwsh
        run: |
          $setup = Resolve-Path target/installer/output/timeline-setup.exe
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid') { throw "Installer signature is not valid: $($signature.Status)" }
          $root = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($root, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          $productVersion = (Get-Item -LiteralPath $setup).VersionInfo.ProductVersion
          if (-not $productVersion.StartsWith($version)) { throw "Installer version mismatch: $productVersion / $version" }
          if ((Get-Item -LiteralPath $setup).Length -le 0) { throw 'Installer is empty' }
